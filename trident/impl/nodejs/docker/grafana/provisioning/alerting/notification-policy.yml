apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-trident
    type: telegram
    settings:
      bottoken: '${TELEGRAM_BOT_TOKEN}'
      chatid: '${TELEGRAM_CHAT_ID}'
    disableResolveMessage: false

routeTree:
  receiver: telegram-trident
  groupBy:
    - grafana_folder
    - alertname
  groupWaitInterval: 30s
  groupIntervalInterval: 5m
  repeatIntervalInterval: 12h
  routes:
    - receiver: telegram-trident
      groupBy:
        - alertname
      matcherOperator: and
      matchers:
        - label: severity
          operator: regex
          value: critical|warning|info
