services:
  trident:
    image: ghcr.io/walshe/trident:latest
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env
      - ./setups:/app/setups
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.3
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=trident
      - GF_USERS_ALLOW_SIGN_UP=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:--placeholder-set-in-env}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:--placeholder-set-in-env}
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    profiles: [observability]
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
