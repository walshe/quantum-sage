# ============================================================
# QUANTUM SAGE -- SYSTEM CONFIGURATION
# This file rarely changes. It holds capital parameters,
# Trident strategy parameters, and size adaptation rules.
# NOT to be confused with the daily setup file.
# ============================================================

capital:
  daily_risk_pct: 0.5          # 0.5% = soft stop; 1% = hard stop (computed on demand)
  # starting_capital_eur removed — position sizing uses live broker equity (CTRADER_ACCOUNT_BALANCE
  # env var seeds the startup window; live balance from the C2 balance poll takes over from there)

trident:
  # Entry allocation splits (must sum to 100)
  entry_1_allocation_pct: 32.5
  entry_2_allocation_pct: 35.0
  entry_3_allocation_pct: 32.5

  # Midpoint offset: shifts Entry 2 slightly toward Entry 1
  # to favour fill probability over a few points of profit.
  # +2 for longs (worse entry, higher fill chance)
  # -2 for shorts (worse entry, higher fill chance)
  midpoint_offset_buy: 2
  midpoint_offset_sell: -2

  # Risk / exit parameters (all in points)
  stop_loss_points: 40
  breakeven_trigger_points: 25
  hard_profit_exit_points: 33
  time_exit_minutes: 180

  # DVS gate -- no trades if DVS exceeds this
  dvs_gate: 75

size_adaptation:
  after_one_loss_day: 0.5    # 50% of normal size
  after_two_loss_days: 0.25  # 25% of normal size

signal:
  # Directory QS watches for new setup YAML files
  watch_dir: "./setups"
  # Reject setup files older than this many hours
  stale_threshold_hours: 6
  # Warn if VWAP has not been updated within this many minutes
  vwap_staleness_warn_minutes: 90

# ── Execution (Phase 2 — auto-order placement at broker) ─────────────────────
# Uncomment and configure to enable live trade execution via cTrader.
# When auto_execute is false (the default) the system is purely advisory.
#
execution:
  auto_execute: false
#   # EUR value per index point per lot for the execution instrument.
#   # US500.cash (Pepperstone CFD): confirm exact value with FB before enabling.
#   # Example: if 1 lot = €1/pt then point_value_eur: 1
  point_value_eur: 1
